workflows:
  unsigned-ios:
    name: Deleter - Unsigned iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/Deleter.xcworkspace"
        XCODE_SCHEME: "Deleter"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prebuild iOS project
        script: npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Archive without signing
        script: |
          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/Deleter.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Package unsigned IPA
        script: |
          mkdir -p build/Payload
          cp -r build/Deleter.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r Deleter.ipa Payload
    artifacts:
      - build/*.ipa

